# Wolfy Docker: Wolf (Moonlight streaming, one container per session) + Wolfy (admin UI)
# + the emulator images of the Wolf apps.
#
#   docker compose up -d --build              Wolf + Wolfy, UI on http://<serveur>:8420
#   docker compose --profile images build     (re)build wolfy-eden / wolfy-retroarch
name: wolfy

services:
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable
    container_name: wolf
    environment:
      - NVIDIA_DRIVER_VOLUME_NAME=nvidia-driver-vol
      # host path of the state folder, used when Wolf mounts app data into app containers
      - HOST_APPS_STATE_FOLDER=/opt/stacks/config/wolf
      - TZ=Europe/Paris
      # API socket, shared with Wolfy through the wolf-api volume
      - WOLF_SOCKET_PATH=/var/run/wolf/wolf.sock
    volumes:
      # same path inside and outside: Wolf uses it both for its config and for app mounts
      - /opt/stacks/config/wolf:/opt/stacks/config/wolf:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /dev/:/dev/:rw
      - /run/udev:/run/udev:rw
      # NVIDIA driver for the app containers: rebuild this volume after a driver upgrade
      - nvidia-driver-vol:/usr/nvidia:rw
      - wolf-api:/var/run/wolf:rw
    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-caps/nvidia-cap1
      - /dev/nvidia-caps/nvidia-cap2
      - /dev/nvidiactl
      - /dev/nvidia0
      - /dev/nvidia-modeset
    device_cgroup_rules:
      - 'c 13:* rmw'
    network_mode: host
    restart: unless-stopped

  wolfy:
    build: .
    image: wolfy:latest
    container_name: wolfy
    depends_on:
      - wolf
    env_file: .env
    environment:
      - WOLFY_IMAGES_DIR=/app/images
      - WOLFY_DIR=${WOLFY_DIR:-/home/remy/Bureau/wolfy}
    ports:
      - "8420:8420"
    volumes:
      - ./data:/data
      # start/stop Wolf, list app containers, build/pull images
      - /var/run/docker.sock:/var/run/docker.sock
      # Wolf state: cfg/config.toml, covers, crash dumps (same path as in the Wolf container)
      - /opt/stacks/config/wolf:/opt/stacks/config/wolf
      # build contexts of the emulator images
      - ./images:/app/images:ro
      # emulator data (config/switch/keys, nand, users), at its host path: the Wolf
      # sessions mount the same paths
      - ./config:${WOLFY_DIR:-/home/remy/Bureau/wolfy}/config
      # Eden settings shared by the host and the Wolf sessions, and Eden's data dir
      # (its keys/ is a link to config/switch/keys)
      - /home/remy/.config/eden:/home/remy/.config/eden
      - /home/remy/.local/share/eden:/home/remy/.local/share/eden
      # read-only view of the host (emulator paths: checks + folder picker)
      - /:/host:ro
      - wolf-api:/var/run/wolf
    restart: unless-stopped

  # emulator images used by the Wolf apps (build only: Wolf starts them per session)
  wolfy-eden:
    build: images/eden
    image: wolfy-eden:latest
    profiles: [images]

  wolfy-retroarch:
    build: images/retroarch
    image: wolfy-retroarch:latest
    profiles: [images]

volumes:
  nvidia-driver-vol:
    external: true
  wolf-api:
    name: wolf-api

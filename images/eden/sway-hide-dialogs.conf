# Room auto-join dialogs (driven by eden-run.sh): fully transparent so the
# player never sees them, but kept on screen (off-screen windows can't be
# clicked, and the Yes/No prompt only reacts to clicks).
for_window [title="^(Connexion directe|Direct Connect|Game already running|Error)$"] opacity 0
# chat window Eden opens once connected ("Maison - … - connecté")
for_window [title="^Maison"] opacity 0
